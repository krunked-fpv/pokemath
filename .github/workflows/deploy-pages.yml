name: Deploy PokéMath to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run engine tests
        run: node --test tests/engine.test.mjs

      - name: Stage clean site artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a \
            --exclude='.agents/' \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='ARCHITECTURE.md' \
            --exclude='SPEC.md' \
            --exclude='HANDOFF.md' \
            --exclude='_site/' \
            ./ _site/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
